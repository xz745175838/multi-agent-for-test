[pytest]
asyncio_mode = auto
# session 级 async fixture（如 engine）与 function 级共用同一事件循环
asyncio_default_fixture_loop_scope = session
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    asyncio: async tests (usually no explicit mark needed when asyncio_mode=auto)
    unit: pure unit tests with no external middleware dependencies
    integration: integration tests (HTTP + DB/Redis dependency injection)
